name: "Gatecheck"
description: "Score how ready your repo is for coding agents. Fails the build when the score drops below a threshold."
author: "Edmarkavs"
branding:
  icon: "check-circle"
  color: "green"
inputs:
  fail-under:
    description: "Minimum score (0-100) required to pass. Use 0 to never fail."
    required: false
    default: "0"
  path:
    description: "Directory to scan, relative to the repo root."
    required: false
    default: "."
outputs:
  score:
    description: "Readiness score 0-100"
    value: ${{ steps.scan.outputs.score }}
  grade:
    description: "Letter grade A-F"
    value: ${{ steps.scan.outputs.grade }}
runs:
  using: "composite"
  steps:
    - name: Scan
      id: scan
      shell: bash
      env:
        INPUT_FAIL_UNDER: ${{ inputs.fail-under }}
        INPUT_PATH: ${{ inputs.path }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 "${{ github.action_path }}/scanner/scan.py" --local="$INPUT_PATH" --json-out=/tmp/gatecheck.json >/tmp/gatecheck.log || true
        cat /tmp/gatecheck.log
        SCORE=$(python3 -c "import json;print(json.load(open('/tmp/gatecheck.json'))['score'])" 2>/dev/null || echo 0)
        GRADE=$(python3 -c "import json;print(json.load(open('/tmp/gatecheck.json'))['grade'])" 2>/dev/null || echo F)
        echo "score=$SCORE" >> "$GITHUB_OUTPUT"
        echo "grade=$GRADE" >> "$GITHUB_OUTPUT"
        echo "### Gatecheck: $SCORE/100 (grade $GRADE)" >> "$GITHUB_STEP_SUMMARY"
        python3 "${{ github.action_path }}/scanner/scan.py" --markdown 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
        awk -v s="$SCORE" -v f="$INPUT_FAIL_UNDER" 'BEGIN{exit !(s+0 < f+0)}' && {
          echo "::error::Gatecheck score $SCORE is below the required $INPUT_FAIL_UNDER"; exit 1; } || true
